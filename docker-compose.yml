services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devpilot:latest
    container_name: devpilot_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
